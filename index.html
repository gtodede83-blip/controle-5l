<script>

/* ============================================================
   CONFIGURAÇÃO SUPABASE
   ============================================================ */

const SUPABASE_URL =
'https://gwpikrmgbtyjjgsfutup.supabase.co';

const SUPABASE_KEY =
'sb_publishable_zciAQZ9MscyBrb1kO7sYUA_ZmfP1ZmG';

const sb =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ============================================================
   ESTADO DO SISTEMA
   ============================================================ */

let produtos = [];
let vendas = [];
let abastecimentos = [];
let ajustes = [];
let clientes = [];
let fiados = [];
let pagamentos = [];


/* ============================================================
   FUNÇÕES BÁSICAS
   ============================================================ */

function hoje(){

    const d = new Date();

    const ano = d.getFullYear();

    const mes =
        String(d.getMonth()+1)
        .padStart(2,'0');

    const dia =
        String(d.getDate())
        .padStart(2,'0');

    return `${ano}-${mes}-${dia}`;
}


function dinheiro(valor){

    return Number(valor || 0)
        .toLocaleString(
            'pt-BR',
            {
                style:'currency',
                currency:'BRL'
            }
        );
}


function esc(texto){

    return String(texto ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
}


function produto(id){

    return produtos.find(
        p => p.id === id
    );
}


function cliente(id){

    return clientes.find(
        c => c.id === id
    );
}


/* ============================================================
   ESTOQUE CORRETO
   abastecimentos + entradas - saídas - vendas
   ============================================================ */

function estoqueProduto(id){

    const entradas =
        abastecimentos
        .filter(a => a.produto_id === id)
        .reduce(
            (total,a) =>
                total + Number(a.quantidade || 0),
            0
        );

    const ajustesEntrada =
        ajustes
        .filter(a =>
            a.produto_id === id &&
            a.tipo === 'entrada'
        )
        .reduce(
            (total,a) =>
                total + Number(a.quantidade || 0),
            0
        );

    const ajustesSaida =
        ajustes
        .filter(a =>
            a.produto_id === id &&
            a.tipo === 'saida'
        )
        .reduce(
            (total,a) =>
                total + Number(a.quantidade || 0),
            0
        );

    const vendasTotal =
        vendas
        .filter(v => v.produto_id === id)
        .reduce(
            (total,v) =>
                total + Number(v.quantidade || 0),
            0
        );

    return Math.max(
        0,
        entradas +
        ajustesEntrada -
        ajustesSaida -
        vendasTotal
    );
}


function estoqueTotal(){

    return produtos.reduce(
        (total,p) =>
            total + estoqueProduto(p.id),
        0
    );
}


/* ============================================================
   STATUS
   ============================================================ */

function statusOk(texto){

    const el =
        document.getElementById('status');

    el.className =
        'status okstatus';

    el.textContent =
        '✓ ' + texto;
}


function statusErro(texto){

    const el =
        document.getElementById('status');

    el.className =
        'status errorstatus';

    el.textContent =
        'Erro: ' + texto;
}


/* ============================================================
   CARREGAR BANCO
   ============================================================ */

async function carregar(){

    try{

        const [
            rProdutos,
            rVendas,
            rAbastecimentos,
            rAjustes,
            rClientes,
            rFiados,
            rPagamentos
        ] = await Promise.all([

            sb
            .from('produtos')
            .select('*')
            .order('nome'),

            sb
            .from('vendas')
            .select('*')
            .order('criado_em',{ascending:false}),

            sb
            .from('abastecimentos')
            .select('*')
            .order('criado_em',{ascending:false}),

            sb
            .from('ajustes_estoque')
            .select('*')
            .order('criado_em',{ascending:false}),

            sb
            .from('clientes')
            .select('*')
            .order('nome'),

            sb
            .from('fiados')
            .select('*')
            .order('criado_em',{ascending:false}),

            sb
            .from('pagamentos')
            .select('*')
            .order('criado_em',{ascending:false})

        ]);


        const erro =
            rProdutos.error ||
            rVendas.error ||
            rAbastecimentos.error ||
            rAjustes.error ||
            rClientes.error ||
            rFiados.error ||
            rPagamentos.error;


        if(erro){

            throw erro;
        }


        produtos =
            rProdutos.data || [];

        vendas =
            rVendas.data || [];

        abastecimentos =
            rAbastecimentos.data || [];

        ajustes =
            rAjustes.data || [];

        clientes =
            rClientes.data || [];

        fiados =
            rFiados.data || [];

        pagamentos =
            rPagamentos.data || [];


        statusOk(
            'Sistema conectado ao Supabase'
        );

        atualizarDashboard();

    }
    catch(erro){

        console.error(erro);

        statusErro(
            erro.message ||
            'Não foi possível carregar o banco.'
        );
    }
}


/* ============================================================
   DASHBOARD
   ============================================================ */

function atualizarDashboard(){

    const dataHoje =
        hoje();


    const vendasHoje =
        vendas.filter(
            v => v.data === dataHoje
        );


    const valorVendas =
        vendasHoje.reduce(
            (total,v) =>
                total + Number(v.total || 0),
            0
        );


    const qtdHoje =
        vendasHoje.reduce(
            (total,v) =>
                total + Number(v.quantidade || 0),
            0
        );


    const aberto =
        fiados.reduce(
            (total,f) =>
                total +
                Math.max(
                    0,
                    Number(f.total || 0) -
                    Number(f.pago || 0)
                ),
            0
        );


    document.getElementById(
        'vendasHoje'
    ).textContent =
        dinheiro(valorVendas);


    document.getElementById(
        'fiadoAberto'
    ).textContent =
        dinheiro(aberto);


    document.getElementById(
        'unidadesHoje'
    ).textContent =
        qtdHoje;


    document.getElementById(
        'estoqueAtual'
    ).textContent =
        estoqueTotal();
}


/* ============================================================
   MODAL
   ============================================================ */

function abrirModal(titulo,conteudo){

    document.getElementById(
        'modalTitle'
    ).textContent = titulo;

    document.getElementById(
        'modalBody'
    ).innerHTML = conteudo;

    document.getElementById(
        'modalBg'
    ).classList.add('show');
}


function fecharModal(){

    document.getElementById(
        'modalBg'
    ).classList.remove('show');

    document.getElementById(
        'modalBody'
    ).innerHTML = '';
}


/* ============================================================
   BOTÕES
   ============================================================ */

document.addEventListener(
    'click',
    function(event){

        const botao =
            event.target.closest(
                '[data-action]'
            );

        if(!botao) return;

        const acao =
            botao.dataset.action;


        if(acao === 'venda')
            abrirVenda();

        if(acao === 'fiado')
            abrirFiado();

        if(acao === 'abastecer')
            abrirAbastecimento();

        if(acao === 'ajustar')
            abrirAjuste();

        if(acao === 'estoque')
            abrirEstoque();

        if(acao === 'fiados')
            abrirFiados();

        if(acao === 'historico')
            abrirHistorico();

        if(acao === 'produtos')
            abrirProdutos();
    }
);


document.getElementById(
    'btnClose'
).addEventListener(
    'click',
    fecharModal
);


document.getElementById(
    'modalBg'
).addEventListener(
    'click',
    function(e){

        if(e.target === this)
            fecharModal();
    }
);


/* ============================================================
   VENDA NORMAL
   ============================================================ */

function abrirVenda(){

    if(!produtos.length){

        abrirModal(
            'Registrar venda',
            `
            <div class="alert alert-warning">
                Nenhum produto cadastrado.
                Primeiro cadastre um produto.
            </div>

            <button
                type="button"
                class="btn dark full"
                data-action="produtos">
                IR PARA PRODUTOS
            </button>
            `
        );

        return;
    }


    const options =
        produtos
        .filter(p => p.ativo !== false)
        .map(p => `
            <option value="${p.id}">
                ${esc(p.nome)}
                — estoque ${estoqueProduto(p.id)}
            </option>
        `)
        .join('');


    abrirModal(
        'Registrar venda',
        `

        <label>Produto</label>

        <select id="vendaProduto">
            ${options}
        </select>


        <div class="row">

            <div>
                <label>Quantidade</label>

                <input
                    id="vendaQtd"
                    type="number"
                    min="1"
                    value="1">
            </div>


            <div>
                <label>Preço de venda</label>

                <input
                    id="vendaPreco"
                    type="number"
                    step="0.01"
                    min="0">
            </div>

        </div>


        <div id="vendaInfo"
             class="alert alert-success mt">
        </div>


        <button
            type="button"
            id="salvarVenda"
            class="btn green full mt">
            REGISTRAR VENDA
        </button>
        `
    );


    const select =
        document.getElementById(
            'vendaProduto'
        );

    function atualizarPreco(){

        const p =
            produto(select.value);

        document.getElementById(
            'vendaPreco'
        ).value =
            Number(p?.preco_repasse || 0)
            .toFixed(2);

        atualizarInfo();
    }


    function atualizarInfo(){

        const p =
            produto(select.value);

        const estoque =
            estoqueProduto(
                select.value
            );

        document.getElementById(
            'vendaInfo'
        ).textContent =
            `Estoque disponível: ${estoque} ${p?.unidade || 'un.'}`;
    }


    select.addEventListener(
        'change',
        atualizarPreco
    );


    document.getElementById(
        'vendaQtd'
    ).addEventListener(
        'input',
        atualizarInfo
    );


    document.getElementById(
        'salvarVenda'
    ).addEventListener(
        'click',
        salvarVenda
    );


    atualizarPreco();
}


async function salvarVenda(){

    const produtoId =
        document.getElementById(
            'vendaProduto'
        ).value;

    const quantidade =
        Number(
            document.getElementById(
                'vendaQtd'
            ).value
        );

    const preco =
        Number(
            document.getElementById(
                'vendaPreco'
            ).value
        );


    if(!produtoId ||
       quantidade < 1 ||
       preco <= 0){

        alert(
            'Preencha produto, quantidade e preço.'
        );

        return;
    }


    const estoque =
        estoqueProduto(produtoId);


    if(quantidade > estoque){

        alert(
            `Estoque insuficiente. Disponível: ${estoque}`
        );

        return;
    }


    const total =
        quantidade * preco;


    const {error} =
        await sb
        .from('vendas')
        .insert({

            produto_id:produtoId,

            quantidade:quantidade,

            preco_venda:preco,

            total:total,

            data:hoje(),

            fiado_id:null

        });


    if(error){

        alert(
            'Erro ao registrar venda: ' +
            error.message
        );

        return;
    }


    await carregar();

    fecharModal();

    alert(
        'Venda registrada com sucesso!'
    );
}


/* ============================================================
   ABASTECIMENTO

    abrirModal(
        'Abastecer estoque',
        `

        <label>Produto</label>

        <select id="abProduto">

            <option value="">
                Selecione...
            </option>

            ${produtos
                .filter(p => p.ativo !== false)
                .map(p => `
                    <option value="${p.id}">
                        ${esc(p.nome)}
                    </option>
                `)
                .join('')
            }

        </select>


        <div class="row">

            <div>

                <label>Quantidade</label>

                <input
                    id="abQtd"
                    type="number"
                    min="1"
                    value="1">

            </div>


            <div>

                <label>Custo unitário</label>

                <input
                    id="abCusto"
                    type="number"
                    step="0.01"
                    min="0"
                    value="0">

            </div>

        </div>


        <label>Observação</label>

        <textarea
            id="abObs"
            placeholder="Opcional"></textarea>


        <button
            type="button"
            id="salvarAb"
            class="btn dark full mt">
            SALVAR ABASTECIMENTO
        </button>

        `
    );


    document.getElementById(
        'salvarAb'
    ).addEventListener(
        'click',
        salvarAbastecimento
    );
}


async function salvarAbastecimento(){

    const produtoId =
        document.getElementById(
            'abProduto'
        ).value;

    const quantidade =
        Number(
            document.getElementById(
                'abQtd'
            ).value
        );

    const custo =
        Number(
            document.getElementById(
                'abCusto'
            ).value
        );

    const observacao =
        document.getElementById(
            'abObs'
        ).value.trim();


    if(!produtoId ||
       quantidade < 1){

        alert(
            'Selecione o produto e informe a quantidade.'
        );

        return;
    }


    const {error} =
        await sb
        .from('abastecimentos')
        .insert({

            produto_id:produtoId,

            quantidade:quantidade,

            custo_unitario:custo,

            data:hoje(),

            observacao:observacao || null
        });


    if(error){

        alert(
            'Erro: ' +
            error.message
        );

        return;
    }


    await carregar();

    fecharModal();

    alert(
        'Estoque abastecido com sucesso!'
    );
}


/* ============================================================
   AJUSTAR ESTOQUE
   ============================================================ */

function abrirAjuste(){

    abrirModal(
        'Ajustar estoque',
        `

async function salvarFiado(){

    const nome =
        document.getElementById(
            'clienteNome'
        ).value.trim();

    const telefone =
        document.getElementById(
            'clienteTelefone'
        ).value.trim();


    if(!nome){

        alert(
            'Informe o nome do cliente.'
        );

        return;
    }


    const linhas =
        Array.from(
            document.querySelectorAll(
                '#fiadoItens .product-row'
            )
        );


    if(!linhas.length){

        alert(
            'Adicione pelo menos um produto.'
        );

        return;
    }


    const itens = [];

    let total = 0;


    for(const linha of linhas){

        const produtoId =
            linha.querySelector(
                '.fiado-produto'
            ).value;

        const quantidade =
            Number(
                linha.querySelector(
                    '.fiado-qtd'
                ).value
            );

        const preco =
            Number(
                linha.querySelector(
                    '.fiado-preco'
                ).value
            );


        if(
            !produtoId ||
            quantidade < 1 ||
            preco <= 0
        ){

            alert(
                'Confira os produtos, quantidades e preços.'
            );

            return;
        }


        const estoque =
            estoqueProduto(
                produtoId
            );


        if(quantidade > estoque){

            const p =
                produto(produtoId);

            alert(
                `Estoque insuficiente para ${p?.nome}. Disponível: ${estoque}.`
            );

            return;
        }


        const itemTotal =
            quantidade * preco;


        total += itemTotal;


        itens.push({

            produto_id:produtoId,

            quantidade:quantidade,

            preco_venda:preco,

            total:itemTotal

        });
    }


    if(total <= 0){

        alert(
            'O total do fiado precisa ser maior que zero.'
        );

        return;
    }


    /* ========================================================
       CLIENTE
       ======================================================== */

    let clienteExistente =
        clientes.find(
            c =>
                c.nome.trim().toLowerCase() ===
                nome.toLowerCase()
        );


    let clienteId;


    if(clienteExistente){

        clienteId =
            clienteExistente.id;


        if(telefone){

            await sb
            .from('clientes')
            .update({
                telefone:telefone
            })
            .eq(
                'id',
                clienteId
            );
        }

    }
    else{

        const resultado =
            await sb
            .from('clientes')
            .insert({

                nome:nome,

                telefone:
                    telefone || null

            })
            .select()
            .single();


        if(resultado.error){

            alert(
                'Erro ao cadastrar cliente: ' +
                resultado.error.message
            );

            return;
        }


        clienteId =
            resultado.data.id;
    }


    /* ========================================================
       FIADO
       ======================================================== */

    const novoFiado =
        await sb
        .from('fiados')
        .insert({

            cliente_id:clienteId,

            data:hoje(),

            total:total,

            pago:0

        })
        .select()
        .single();


    if(novoFiado.error){

        alert(
            'Erro ao registrar fiado: ' +
            novoFiado.error.message
        );

        return;
    }


    const fiadoId =
        novoFiado.data.id;


    /* ========================================================
       VENDAS DO FIADO
       ======================================================== */

    const vendasInserir =
        itens.map(item => ({

            produto_id:
                item.produto_id,

            quantidade:
                item.quantidade,

            preco_venda:
                item.preco_venda,

            total:
                item.total,

            data:
                hoje(),

            fiado_id:
                fiadoId
        }));


    const vendaResult =
        await sb
        .from('vendas')
        .insert(
            vendasInserir
        );


    if(vendaResult.error){

        /*
          Tenta apagar o fiado criado
          caso a gravação dos produtos falhe.
        */

        await sb
        .from('fiados')
        .delete()
        .eq(
            'id',
            fiadoId
        );


        alert(
            'Erro ao registrar produtos do fiado: ' +
            vendaResult.error.message
        );

        return;
    }


    await carregar();

    fecharModal();

    alert(
        `Fiado registrado!\n\nCliente: ${nome}\nTotal: ${dinheiro(total)}\nProdutos: ${itens.length}`
    );
}

async function receberFiado(fiadoId){

    const f =
        fiados.find(
            x => x.id === fiadoId
        );


    if(!f) return;


    const aberto =
        Math.max(
            0,
            Number(f.total || 0) -
            Number(f.pago || 0)
        );


    const valorTexto =
        prompt(
            `Valor recebido de ${cliente(f.cliente_id)?.nome || 'cliente'}:\nEm aberto: ${dinheiro(aberto)}`,
            aberto.toFixed(2)
        );


    if(valorTexto === null)
        return;


    const valor =
        Number(
            valorTexto.replace(',','.')
        );


    if(
        !Number.isFinite(valor) ||
        valor <= 0
    ){

        alert(
            'Informe um valor válido.'
        );

        return;
    }


    const valorReal =
        Math.min(
            valor,
            aberto
        );


    const pagamento =
        await sb
        .from('pagamentos')
        .insert({

            fiado_id:fiadoId,

            valor:valorReal,

            data:hoje()

        });


    if(pagamento.error){

        alert(
            'Erro ao registrar pagamento: ' +
            pagamento.error.message
        );

        return;
    }


    const novoPago =
        Number(f.pago || 0) +
        valorReal;


    const atualizar =
        await sb
        .from('fiados')
        .update({
            pago:Math.min(
                novoPago,
                Number(f.total)
            )
        })
        .eq(
            'id',
            fiadoId
        );


    if(atualizar.error){

        alert(
            'Pagamento registrado, mas houve erro ao atualizar o fiado: ' +
            atualizar.error.message
        );

        return;
    }


    await carregar();

    abrirFiados();

    alert(
        'Pagamento registrado!'
    );
}

async function excluirProduto(id){

        produto(id);


    if(!p) return;


    const confirmar =
        confirm(
            `Deseja excluir "${p.nome}"?\n\nO produto ficará INATIVO para preservar o histórico.`
        );


    if(!confirmar)
        return;


    /*
       Não apagamos fisicamente porque vendas
       antigas precisam continuar existindo.
    */

    const {error} =
        await sb
        .from('produtos')
        .update({
            ativo:false
        })
        .eq(
            'id',
            id
        );


    if(error){

        alert(
            'Erro ao excluir produto: ' +
            error.message
        );

        return;
    }


    await carregar();

    abrirProdutos();

    alert(
        'Produto excluído da lista de ativos.'
    );
}


/* ============================================================
   HISTÓRICO
   ============================================================ */

function abrirHistorico(){

    let movimentos = [];


    vendas.forEach(v => {

        const p =
            produto(v.produto_id);

        const f =
            v.fiado_id
            ? fiados.find(
                x => x.id === v.fiado_id
            )
            : null;


        movimentos.push({

            data:v.data,

            ordem:v.criado_em,

            tipo:
                f
                ? 'FIADO'
                : 'VENDA',

            descricao:
                `${p?.nome || 'Produto'} — ${v.quantidade} ${p?.unidade || 'un.'}`,

            valor:
                Number(v.total || 0),

            detalhe:
                f
                ? `Cliente: ${cliente(f.cliente_id)?.nome || ''}`
                : 'Venda normal'

        });
    });


    abastecimentos.forEach(a => {

        const p =
            produto(a.produto_id);


        movimentos.push({

            data:a.data,

            ordem:a.criado_em,

            tipo:'ENTRADA',

            descricao:
                `${p?.nome || 'Produto'} — +${a.quantidade}`,

            valor:
                0,

            detalhe:
                a.observacao || 'Abastecimento'
        });
    });


    ajustes.forEach(a => {

        const p =
            produto(a.produto_id);


        movimentos.push({

            data:a.data,

            ordem:a.criado_em,

            tipo:
                a.tipo === 'entrada'
                ? 'AJUSTE +'
                : 'AJUSTE -',

            descricao:
                `${p?.nome || 'Produto'} — ${a.quantidade}`,

            valor:
                0,

            detalhe:
                a.motivo || 'Ajuste de estoque'
        });
    });


    pagamentos.forEach(pg => {

        const f =
            fiados.find(
                x => x.id === pg.fiado_id
            );


        movimentos.push({

            data:pg.data,

            ordem:pg.criado_em,

            tipo:'PAGAMENTO',

            descricao:
                cliente(f?.cliente_id)?.nome ||
                'Cliente',

            valor:
                Number(pg.valor || 0),

            detalhe:
                'Recebimento de fiado'
        });
    });


    movimentos.sort(
        (a,b) =>
            new Date(b.ordem || b.data) -
            new Date(a.ordem || a.data)
    );


    let html = `

        <button
            type="button"
            id="limparHistorico"
            class="btn red full">
            🗑️ LIMPAR HISTÓRICO
        </button>

        <div class="list">
    `;


    if(!movimentos.length){

        html +=
            '<div class="empty">Nenhuma movimentação registrada.</div>';
    }
    else{

        movimentos.forEach(m => {

            html += `

                <div class="item">

                    <span class="badge ${
                        m.tipo === 'FIADO'
                        ? 'badge-yellow'
                        :
                        m.tipo === 'VENDA'
                        ? 'badge-green'
                        :
                        'badge-green'
                    }">
                        ${esc(m.tipo)}
                    </span>

                    <div class="item-title"
                         style="margin-top:7px">

                        ${esc(m.descricao)}

                    </div>

                    <div class="muted">
                        ${esc(m.data)}
                        ·
                        ${esc(m.detalhe)}
                    </div>

                    ${
                        m.valor > 0
                        ?
                        `
                        <div style="margin-top:5px">
                            ${dinheiro(m.valor)}
                        </div>
                        `
                        :
                        ''
                    }

                </div>

            `;
        });
    }


    html += '</div>';


    abrirModal(
        'Histórico de movimentações',
        html
    );


    document.getElementById(
        'limparHistorico'
    ).addEventListener(
        'click',
        limparHistorico
    );
}


/* ============================================================
   LIMPAR HISTÓRICO
   ============================================================ */

async function limparHistorico(){

    const confirmar =
        confirm(
            'ATENÇÃO!\n\nIsso apagará vendas, fiados, pagamentos, abastecimentos e ajustes de estoque.\n\nOs produtos continuarão cadastrados, mas o estoque voltará para ZERO.\n\nDeseja continuar?'
        );


    if(!confirmar)
        return;


    const confirmar2 =
        prompt(
            'Digite LIMPAR para confirmar.'
        );


    if(confirmar2 !== 'LIMPAR'){

        alert(
            'Operação cancelada.'
        );

        return;
    }


    try{

        /*
           Ordem respeita as relações
           entre as tabelas.
        */

        let r;


        r = await sb
            .from('pagamentos')
            .delete()
            .neq('id','00000000-0000-0000-0000-000000000000');

        if(r.error) throw r.error;


        r = await sb
            .from('vendas')
            .delete()
            .neq('id','00000000-0000-0000-0000-000000000000');

        if(r.error) throw r.error;


        r = await sb
            .from('fiados')
            .delete()
            .neq('id','00000000-0000-0000-0000-000000000000');

        if(r.error) throw r.error;


        r = await sb
            .from('ajustes_estoque')
            .delete()
            .neq('id','00000000-0000-0000-0000-000000000000');

        if(r.error) throw r.error;


        r = await sb
            .from('abastecimentos')
            .delete()
            .neq('id','00000000-0000-0000-0000-000000000000');

        if(r.error) throw r.error;


        await carregar();

        fecharModal();

        alert(
            'Histórico limpo com sucesso.\n\nOs produtos foram mantidos e o estoque foi zerado.'
        );

    }
    catch(error){

        alert(
            'Erro ao limpar histórico: ' +
            error.message
        );
    }
}


/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */

carregar();

</script>
