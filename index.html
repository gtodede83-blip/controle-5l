<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle 5L</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f6f8;
  color:#18202a;
  font-family:Arial,sans-serif
}

header{
  background:#111827;
  color:#fff;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:10
}

header h1{
  margin:0;
  font-size:24px
}

header p{
  margin:5px 0 0;
  font-size:13px;
  opacity:.75
}

main{
  max-width:700px;
  margin:auto;
  padding:15px
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 10px #00000012
}

.card span{
  font-size:13px;
  color:#66717d
}

.card strong{
  display:block;
  font-size:21px;
  margin-top:6px
}

nav{
  display:grid;
  gap:10px;
  margin:15px 0
}

.btn{
  border:0;
  border-radius:12px;
  padding:15px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  width:100%
}

.btn:active{
  transform:scale(.98)
}

.green{
  background:#16a34a;
  color:#fff
}

.yellow{
  background:#facc15;
  color:#111
}

.dark{
  background:#111827;
  color:#fff
}

.white{
  background:#fff;
  border:1px solid #d7dce1;
  color:#111827
}

.red{
  background:#dc2626;
  color:#fff
}

.blue{
  background:#2563eb;
  color:#fff
}

section{
  display:none;
  margin-top:12px
}

section.show{
  display:block
}

.panel{
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 10px #00000012
}

.panel h2{
  margin-top:0
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 6px
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ccd3da;
  border-radius:10px;
  font-size:15px;
  background:#fff
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.line{
  padding:13px 0;
  border-bottom:1px solid #eee
}

.line:last-child{
  border-bottom:0
}

.muted{
  color:#66717d
}

.ok{
  color:#15803d;
  font-weight:700
}

.warning{
  color:#b45309;
  font-weight:700
}

.danger{
  color:#dc2626;
  font-weight:700
}

.alert{
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:12px;
  font-size:14px;
  font-weight:700
}

.alert.ok{
  background:#dcfce7;
  color:#166534
}

.alert.error{
  background:#fee2e2;
  color:#991b1b
}

.alert.info{
  background:#dbeafe;
  color:#1e40af
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left
}

th{
  background:#f8fafc
}

footer{
  text-align:center;
  padding:25px;
  color:#66717d;
  font-size:12px
}

.hidden{
  display:none!important
}

@media(max-width:520px){
  .grid,.row{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <h1>Controle 5L</h1>
  <p>Controle de produtos, estoque, vendas e fiados</p>
</header>

<main>

<div id="mensagem"></div>

<div id="home" class="show">

  <div class="grid">

    <div class="card">
      <span>Vendas hoje</span>
      <strong id="hVendas">R$ 0,00</strong>
    </div>

    <div class="card">
      <span>Fiado em aberto</span>
      <strong id="hFiado">R$ 0,00</strong>
    </div>

    <div class="card">
      <span>Unidades vendidas</span>
      <strong id="hQtd">0</strong>
    </div>

    <div class="card">
      <span>Estoque atual</span>
      <strong id="hEstoque">0</strong>
    </div>

  </div>

  <nav>

    <button class="btn green" onclick="abrir('venda')">
      💰 REGISTRAR VENDA
    </button>

    <button class="btn yellow" onclick="abrir('fiado')">
      🧾 REGISTRAR FIADO
    </button>

    <button class="btn dark" onclick="abrir('abastecer')">
      📦 ABASTECER ESTOQUE
    </button>

    <button class="btn white" onclick="abrir('estoqueSec')">
      📊 VER ESTOQUE
    </button>

    <button class="btn white" onclick="abrir('relatorio')">
      📋 RELATÓRIO
    </button>

    <button class="btn blue" onclick="compartilharWhatsApp()">
      📱 COMPARTILHAR NO WHATSAPP
    </button>

  </nav>

</div>


<!-- VENDA -->

<section id="venda">

<div class="panel">

<button class="btn white" onclick="abrir('home')">
  ← VOLTAR
</button>

<h2>💰 Registrar Venda</h2>

<label>Produto</label>
<select id="vProd" onchange="preencherPreco('v')">
<option value="">Selecione o produto</option>
</select>

<div class="row">

<div>
<label>Quantidade</label>
<input id="vQtd" type="number" min="1" value="1">
</div>

<div>
<label>Preço por unidade</label>
<input id="vPreco" type="number" min="0" step="0.01">
</div>

</div>

<br>

<button class="btn green" onclick="vender()">
  💰 CONFIRMAR VENDA
</button>

</div>

</section>


<!-- FIADO -->

<section id="fiado">

<div class="panel">

<button class="btn white" onclick="abrir('home')">
  ← VOLTAR
</button>

<h2>🧾 Registrar Fiado</h2>

<label>Cliente</label>
<input id="fCliente" type="text" placeholder="Nome do cliente">

<label>Produto</label>
<select id="fProd" onchange="preencherPreco('f')">
<option value="">Selecione o produto</option>
</select>

<div class="row">

<div>
<label>Quantidade</label>
<input id="fQtd" type="number" min="1" value="1">
</div>

<div>
<label>Preço por unidade</label>
<input id="fPreco" type="number" min="0" step="0.01">
</div>

</div>

<br>

<button class="btn yellow" onclick="registrarFiado()">
  🧾 CONFIRMAR FIADO
</button>

</div>

</section>


<!-- ABASTECIMENTO -->

<section id="abastecer">

<div class="panel">

<button class="btn white" onclick="abrir('home')">
  ← VOLTAR
</button>

<h2>📦 Abastecer Estoque</h2>

<label>Produto</label>
<input id="pNome" type="text" placeholder="Nome do produto">

<div class="row">

<div>
<label>Custo por unidade</label>
<input id="pCusto" type="number" min="0" step="0.01" value="8">
</div>

<div>
<label>Preço de repasse</label>
<input id="pRepasse" type="number" min="0" step="0.01" value="14.99">
</div>

</div>

<label>Quantidade recebida</label>
<input id="pQtd" type="number" min="1" value="1">

<br><br>

<button class="btn dark" onclick="abastecer()">
  📦 SALVAR ABASTECIMENTO
</button>

</div>

</section>


<!-- ESTOQUE -->

<section id="estoqueSec">

<div class="panel">

<button class="btn white" onclick="abrir('home')">
  ← VOLTAR
</button>

<h2>📊 Estoque Atual</h2>

<div id="estoque"></div>

</div>

</section>


<!-- RELATÓRIO -->

<section id="relatorio">

<div class="panel">

<button class="btn white" onclick="abrir('home')">
  ← VOLTAR
</button>

<h2>📋 Relatório</h2>

<div id="rel"></div>

</div>

</section>


<!-- FIADOS -->

<section id="fiadosSec">

<div class="panel">

<button class="btn white" onclick="abrir('home')">
  ← VOLTAR
</button>

<h2>🧾 Fiados em aberto</h2>

<div id="fiados"></div>

</div>

</section>

<footer>
Controle 5L • Sistema conectado ao Supabase
</footer>

</main>


<script>

/* =========================================================
   CONFIGURAÇÃO SUPABASE
========================================================= */

const SUPABASE_URL =
'https://gwpikrmgbtyjjgsfutup.supabase.co';

const SUPABASE_KEY =
'sb_publishable_zciAQZ9MscyBrb1kO7sYUA_ZmfP1ZmG';

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   BANCO LOCAL PARA VENDAS/FIADOS
   PRODUTOS E ABASTECIMENTOS FICAM NO SUPABASE
========================================================= */

const LOCAL_KEY='controle5l_operacao_v1';

let localDB=JSON.parse(
  localStorage.getItem(LOCAL_KEY) ||
  '{"vendas":[],"fiados":[],"recebimentos":[]}'
);


/* =========================================================
   FUNÇÕES BÁSICAS
========================================================= */

function salvarLocal(){

  localStorage.setItem(
    LOCAL_KEY,
    JSON.stringify(localDB)
  );

}

function hoje(){

  const d=new Date();

  return d.toISOString().slice(0,10);

}

function dinheiro(valor){

  return Number(valor||0).toLocaleString(
    'pt-BR',
    {
      style:'currency',
      currency:'BRL'
    }
  );

}

function gerarId(){

  if(window.crypto && crypto.randomUUID){

    return crypto.randomUUID();

  }

  return Date.now().toString()+
         Math.random().toString(16).slice(2);

}

function mostrarMensagem(texto,tipo='ok'){

  const el=document.getElementById('mensagem');

  el.innerHTML=
    `<div class="alert ${tipo}">
      ${texto}
    </div>`;

  setTimeout(()=>{

    el.innerHTML='';

  },4000);

}

function abrir(id){

  document
    .querySelectorAll('section,#home')
    .forEach(el=>{
      el.classList.remove('show');
    });

  document
    .getElementById(id)
    .classList.add('show');

  render();

}


/* =========================================================
   PRODUTOS
========================================================= */

let produtos=[];

async function carregarProdutos(){

  const {data,error}=await supabaseClient
    .from('produtos')
    .select('*')
    .eq('ativo',true)
    .order('nome');

  if(error){

    console.error(error);

    mostrarMensagem(
      'Erro ao carregar produtos: '+error.message,
      'error'
    );

    return;

  }

  produtos=data||[];

}


function produtoPorId(id){

  return produtos.find(
    p=>String(p.id)===String(id)
  );

}


/* =========================================================
   SELECTS
========================================================= */

function atualizarSelects(){

  const opcoes=
    '<option value="">Selecione o produto</option>'+
    produtos.map(p=>
      `<option value="${p.id}">
        ${p.nome}
      </option>`
    ).join('');

  document.getElementById('vProd').innerHTML=opcoes;

  document.getElementById('fProd').innerHTML=opcoes;

}


/* =========================================================
   PREÇO AUTOMÁTICO
========================================================= */

function preencherPreco(tipo){

  const select=
    document.getElementById(
      tipo==='v'?'vProd':'fProd'
    );

  const produto=
    produtoPorId(select.value);

  if(!produto)return;

  const preco=
    produto.preco_repasse ??
    produto.repasse ??
    0;

  document.getElementById(
    tipo==='v'?'vPreco':'fPreco'
  ).value=preco;

}


/* =========================================================
   ESTOQUE
========================================================= */

function quantidadeAbastecidaProduto(id){

  return localDB.abastecimentos
    ? localDB.abastecimentos
      .filter(x=>x.produtoId===id)
      .reduce((s,x)=>s+Number(x.quantidade||0),0)
    : 0;

}


/*
  Para produtos que já existiam no Supabase,
  usamos a quantidade armazenada localmente.
*/

function estoqueProduto(id){

  const abastecido=
    localDB.abastecimentos
      ?.filter(x=>x.produtoId===id)
      .reduce(
        (s,x)=>s+Number(x.quantidade||0),
        0
      )||0;

  const vendido=
    localDB.vendas
      .filter(x=>x.produtoId===id)
      .reduce(
        (s,x)=>s+Number(x.quantidade||0),
        0
      );

  return abastecido-vendido;

}


/* =========================================================
   ABASTECER
========================================================= */

async function abastecer(){

  const nome=
    document
      .getElementById('pNome')
      .value
      .trim();

  const custo=
    Number(
      document.getElementById('pCusto').value
    );

  const repasse=
    Number(
      document.getElementById('pRepasse').value
    );

  const quantidade=
    Number(
      document.getElementById('pQtd').value
    );


  if(!nome){

    alert('Informe o nome do produto.');

    return;

  }

  if(custo<0){

    alert('Informe um custo válido.');

    return;

  }

  if(repasse<=0){

    alert('Informe o preço de repasse.');

    return;

  }

  if(quantidade<1){

    alert('Informe a quantidade.');

    return;

  }


  /* Procura produto existente */

  let produto=
    produtos.find(
      p=>p.nome.toLowerCase()===
         nome.toLowerCase()
    );


  /* Se não existir, cria no Supabase */

  if(!produto){

    const {data,error}=
      await supabaseClient
        .from('produtos')
        .insert({
          nome:nome,
          unidade:'unidade',
          custo:custo,
          preco_repasse:repasse,
          ativo:true
        })
        .select()
        .single();

    if(error){

      console.error(error);

      alert(
        'Não foi possível cadastrar o produto: '+
        error.message
      );

      return;

    }

    produto=data;

    produtos.push(produto);

  }


  /* Atualiza custo/preço */

  const {error:updateError}=
    await supabaseClient
      .from('produtos')
      .update({
        custo:custo,
        preco_repasse:repasse
      })
      .eq('id',produto.id);


  if(updateError){

    console.error(updateError);

    alert(
      'Produto encontrado, mas não foi possível atualizar os preços: '+
      updateError.message
    );

    return;

  }


  /*
    Guarda o movimento localmente.
    A tabela abastecimentos existente também recebe o lançamento.
  */

  const movimento={
    id:gerarId(),
    produtoId:produto.id,
    quantidade:quantidade,
    custo:custo,
    data:hoje()
  };


  const {error:abError}=
    await supabaseClient
      .from('abastecimentos')
      .insert({
        produto_id:produto.id,
        quantidade:quantidade,
        custo_unitario:custo,
        data:hoje()
      });


  /*
    Se a tabela não aceitar o lançamento,
    ainda mantemos a operação no aparelho
    para o sistema não travar.
  */

  if(abError){

    console.warn(
      'Abastecimento não gravado no Supabase:',
      abError.message
    );

  }


  if(!localDB.abastecimentos){

    localDB.abastecimentos=[];

  }

  localDB.abastecimentos.push(movimento);

  salvarLocal();


  document.getElementById('pNome').value='';
  document.getElementById('pQtd').value=1;

  mostrarMensagem(
    `Abastecimento registrado! Lucro por unidade: ${dinheiro(repasse-custo)}`
  );

  await carregarProdutos();

  atualizarSelects();

  abrir('home');

}


/* =========================================================
   VENDA NORMAL
========================================================= */

function vender(){

  const produtoId=
    document.getElementById('vProd').value;

  const quantidade=
    Number(
      document.getElementById('vQtd').value
    );

  const preco=
    Number(
      document.getElementById('vPreco').value
    );


  const produto=
    produtoPorId(produtoId);


  if(!produto){

    alert('Selecione um produto.');

    return;

  }

  if(quantidade<1){

    alert('Informe uma quantidade válida.');

    return;

  }

  if(preco<=0){

    alert('Informe um preço válido.');

    return;

  }


  const estoque=
    estoqueProduto(produtoId);


  if(estoque<quantidade){

    alert(
      `Estoque insuficiente.\n\n`+
      `Produto: ${produto.nome}\n`+
      `Estoque disponível: ${estoque}\n`+
      `Quantidade solicitada: ${quantidade}`
    );

    return;

  }


  const venda={
    id:gerarId(),
    produtoId:produtoId,
    quantidade:quantidade,
    preco:preco,
    total:quantidade*preco,
    data:hoje(),
    fiado:false
  };


  localDB.vendas.push(venda);

  salvarLocal();


  mostrarMensagem(
    'Venda registrada com sucesso!'
  );


  document.getElementById('vQtd').value=1;

  abrir('home');

}


/* =========================================================
   FIADO
========================================================= */

function registrarFiado(){

  const cliente=
    document
      .getElementById('fCliente')
      .value
      .trim();

  const produtoId=
    document.getElementById('fProd').value;

  const quantidade=
    Number(
      document.getElementById('fQtd').value
    );

  const preco=
    Number(
      document.getElementById('fPreco').value
    );


  const produto=
    produtoPorId(produtoId);


  if(!cliente){

    alert('Informe o nome do cliente.');

    return;

  }

  if(!produto){

    alert('Selecione um produto.');

    return;

  }

  if(quantidade<1){

    alert('Informe uma quantidade válida.');

    return;

  }

  if(preco<=0){

    alert('Informe um preço válido.');

    return;

  }


  const estoque=
    estoqueProduto(produtoId);


  if(estoque<quantidade){

    alert(
      `Estoque insuficiente.\n\n`+
      `Disponível: ${estoque}`
    );

    return;

  }


  const id=gerarId();

  const total=
    quantidade*preco;


  localDB.vendas.push({

    id:id,
    produtoId:produtoId,
    quantidade:quantidade,
    preco:preco,
    total:total,
    data:hoje(),
    fiado:true

  });


  localDB.fiados.push({

    id:id,
    cliente:cliente,
    vendaId:id,
    total:total,
    pago:0,
    data:hoje()

  });


  salvarLocal();


  document.getElementById('fCliente').value='';
  document.getElementById('fQtd').value=1;


  mostrarMensagem(
    'Fiado registrado com sucesso!'
  );


  abrir('home');

}


/* =========================================================
   RECEBER FIADO
========================================================= */

function receber(id){

  const fiado=
    localDB.fiados.find(
      f=>f.id===id
    );

  if(!fiado)return;


  const aberto=
    fiado.total-fiado.pago;


  const valor=
    Number(
      prompt(
        `Cliente: ${fiado.cliente}\n`+
        `Em aberto: ${dinheiro(aberto)}\n\n`+
        `Digite o valor recebido:`,
        aberto.toFixed(2)
      )
    );


  if(!valor || valor<=0)return;


  fiado.pago=
    Math.min(
      fiado.total,
      fiado.pago+valor
    );


  localDB.recebimentos.push({

    id:gerarId(),
    fiadoId:id,
    valor:valor,
    data:hoje()

  });


  salvarLocal();

  render();

  mostrarMensagem(
    'Recebimento registrado!'
  );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  /* Vendas de hoje */

  const vendasHoje=
    localDB.vendas.filter(
      v=>v.data===hoje()
    );


  const vendasNormais=
    vendasHoje
      .filter(v=>!v.fiado)
      .reduce(
        (s,v)=>s+Number(v.total||0),
        0
      );


  const unidades=
    vendasHoje.reduce(
      (s,v)=>s+Number(v.quantidade||0),
      0
    );


  const fiadoAberto=
    localDB.fiados.reduce(
      (s,f)=>
        s+
        Math.max(
          0,
          Number(f.total||0)-
          Number(f.pago||0)
        ),
      0
    );


  const estoqueTotal=
    produtos.reduce(
      (s,p)=>
        s+
        Math.max(
          0,
          estoqueProduto(p.id)
        ),
      0
    );


  document.getElementById('hVendas')
    .textContent=dinheiro(vendasNormais);

  document.getElementById('hFiado')
    .textContent=dinheiro(fiadoAberto);

  document.getElementById('hQtd')
    .textContent=unidades;

  document.getElementById('hEstoque')
    .textContent=estoqueTotal;


  /* ESTOQUE */

  const estoqueHTML=
    produtos.map(p=>{

      const estoque=
        estoqueProduto(p.id);

      const custo=
        Number(p.custo||0);

      const repasse=
        Number(
          p.preco_repasse ??
          p.repasse ??
          0
        );

      const lucro=
        repasse-custo;


      let classe='ok';

      if(estoque<=0)
        classe='danger';

      else if(estoque<=5)
        classe='warning';


      return `
        <div class="line">

          <b>${p.nome}</b>

          <br>

          <span class="muted">
            Estoque:
          </span>

          <b class="${classe}">
            ${estoque} un.
          </b>

          <br>

          Custo:
          ${dinheiro(custo)}

          • Repasse:
          ${dinheiro(repasse)}

          <br>

          <span class="ok">
            Lucro/un.: ${dinheiro(lucro)}
          </span>

        </div>
      `;

    }).join('');


  document.getElementById('estoque')
    .innerHTML=
      estoqueHTML ||
      '<p>Nenhum produto cadastrado.</p>';


  /* FIADOS */

  const fiadosAbertos=
    localDB.fiados.filter(
      f=>Number(f.pago)<Number(f.total)
    );


  const fiadosHTML=
    fiadosAbertos.map(f=>{

      const aberto=
        Number(f.total)-
        Number(f.pago);


      return `
        <div class="line">

          <b>${f.cliente}</b>

          <br>

          Em aberto:
          <strong class="danger">
            ${dinheiro(aberto)}
          </strong>

          <br>

          <button
            class="btn green"
            style="margin-top:8px"
            onclick="receber('${f.id}')">
            💰 RECEBER
          </button>

        </div>
      `;

    }).join('');


  document.getElementById('fiados')
    .innerHTML=
      fiadosHTML ||
      '<p>Nenhum fiado em aberto.</p>';


  /* RELATÓRIO */

  const fiadoHoje=
    vendasHoje
      .filter(v=>v.fiado)
      .reduce(
        (s,v)=>s+Number(v.total||0),
        0
      );


  document.getElementById('rel').innerHTML=`

    <p>
      <b>Data:</b>
      ${new Date().toLocaleDateString('pt-BR')}
    </p>

    <table>

      <tr>
        <th>Indicador</th>
        <th>Valor</th>
      </tr>

      <tr>
        <td>Unidades vendidas</td>
        <td>${unidades}</td>
      </tr>

      <tr>
        <td>Vendas normais</td>
        <td>${dinheiro(vendasNormais)}</td>
      </tr>

      <tr>
        <td>Fiado hoje</td>
        <td>${dinheiro(fiadoHoje)}</td>
      </tr>

      <tr>
        <td>Fiado em aberto</td>
        <td>${dinheiro(fiadoAberto)}</td>
      </tr>

      <tr>
        <td>Estoque atual</td>
        <td>${estoqueTotal} unidades</td>
      </tr>

    </table>

    <br>

    <button
      class="btn blue"
      onclick="abrir('fiadosSec')">
      🧾 VER FIADOS
    </button>

  `;

}


/* =========================================================
   WHATSAPP
========================================================= */

function compartilharWhatsApp(){

  const vendasHoje=
    localDB.vendas.filter(
      v=>v.data===hoje()
    );


  const normal=
    vendasHoje
      .filter(v=>!v.fiado)
      .reduce(
        (s,v)=>s+Number(v.total||0),
        0
      );


  const unidades=
    vendasHoje.reduce(
      (s,v)=>s+Number(v.quantidade||0),
      0
    );


  const fiado=
    localDB.fiados.reduce(
      (s,f)=>
        s+
        Math.max(
          0,
          Number(f.total||0)-
          Number(f.pago||0)
        ),
      0
    );


  const estoque=
    produtos.reduce(
      (s,p)=>
        s+
        Math.max(
          0,
          estoqueProduto(p.id)
        ),
      0
    );


  const texto=
`📋 PRESTAÇÃO DE CONTAS - CONTROLE 5L

📅 Data: ${new Date().toLocaleDateString('pt-BR')}

💰 Vendas normais: ${dinheiro(normal)}

📦 Unidades vendidas: ${unidades}

🧾 Fiado em aberto: ${dinheiro(fiado)}

📊 Estoque atual: ${estoque} unidades`;


  window.open(
    'https://wa.me/?text='+
    encodeURIComponent(texto),
    '_blank'
  );

}

}


/* INICIA */

iniciar();
