<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
'https://gwpikrmgbtyjjgsfutup.supabase.co';

const SUPABASE_KEY =
'sb_publishable_zciAQZ9MscyBrb1kO7sYUA_ZmfP1ZmG';

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   DADOS
========================================= */

let produtos = [];
let vendas = [];
let clientes = [];
let abastecimentos = [];
let pagamentos = [];
let ajustes = [];


/* =========================================
   FUNÇÕES BÁSICAS
========================================= */

function hoje(){

    const d = new Date();

    const ano = d.getFullYear();

    const mes =
        String(d.getMonth()+1).padStart(2,'0');

    const dia =
        String(d.getDate()).padStart(2,'0');

    return `${ano}-${mes}-${dia}`;
}


function dinheiro(valor){

    return Number(valor || 0)
        .toLocaleString(
            'pt-BR',
            {
                style:'currency',
                currency:'BRL'
            }
        );
}


function numero(valor){

    return Number(valor || 0);
}


function idNovo(){

    if(window.crypto &&
       crypto.randomUUID){

        return crypto.randomUUID();

    }

    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'
        .replace(/[xy]/g,function(c){

            const r =
                Math.random()*16|0;

            const v =
                c==='x'
                ? r
                : (r&0x3|0x8);

            return v.toString(16);

        });
}


function produtoPorId(id){

    return produtos.find(
        p => p.id === id
    );
}


function clientePorId(id){

    return clientes.find(
        c => c.id === id
    );
}


/* =========================================
   STATUS
========================================= */

function status(texto,erro=false){

    const el =
        document.getElementById('status');

    el.textContent =
        texto;

    el.className =
        'status ' +
        (erro ? 'erro' : 'ok');

}


/* =========================================
   CARREGAR BANCO
========================================= */

async function carregar(){

    try{

        status('Conectando ao Supabase...');

        const p =
            await supabaseClient
                .from('produtos')
                .select('*')
                .order('nome');

        if(p.error)
            throw p.error;

        produtos =
            p.data || [];


        const v =
            await supabaseClient
                .from('vendas')
                .select('*')
                .order('data',{ascending:false});

        if(v.error)
            throw v.error;

        vendas =
            v.data || [];


        const c =
            await supabaseClient
                .from('clientes')
                .select('*')
                .order('nome');

        if(c.error)
            throw c.error;

        clientes =
            c.data || [];


        const a =
            await supabaseClient
                .from('abastecimentos')
                .select('*');

        if(a.error)
            throw a.error;

        abastecimentos =
            a.data || [];


        const pg =
            await supabaseClient
                .from('pagamentos')
                .select('*');

        if(pg.error)
            throw pg.error;

        pagamentos =
            pg.data || [];


        const aj =
            await supabaseClient
                .from('ajustes_estoque')
                .select('*');

        if(aj.error)
            throw aj.error;

        ajustes =
            aj.data || [];


        status('✓ Sistema conectado ao Supabase');

        atualizarDashboard();

    }catch(e){

        console.error(e);

        status(
            'Erro ao carregar o banco: ' +
            (e.message || e),
            true
        );

    }

}


/* =========================================
   ESTOQUE
========================================= */

function estoqueProduto(produtoId){

    const entradas =
        abastecimentos
            .filter(
                a => a.produto_id === produtoId
            )
            .reduce(
                (s,a) =>
                    s + numero(a.quantidade),
                0
            );


    const saidas =
        vendas
            .filter(
                v => v.produto_id === produtoId
            )
            .reduce(
                (s,v) =>
                    s + numero(v.quantidade),
                0
            );


    const ajustesProduto =
        ajustes
            .filter(
                a => a.produto_id === produtoId
            );


    let saldo =
        entradas - saidas;


    /*
      Os ajustes representam a nova
      quantidade física encontrada.
    */

    if(ajustesProduto.length){

        const ultimo =
            ajustesProduto
                .sort(
                    (a,b) =>
                        new Date(b.criado_em || b.data) -
                        new Date(a.criado_em || a.data)
                )[0];

        saldo =
            numero(ultimo.quantidade_nova);

    }


    return saldo;
}


function estoqueTotal(){

    return produtos.reduce(
        (total,p) =>
            total + estoqueProduto(p.id),
        0
    );

}


/* =========================================
   DASHBOARD
========================================= */

function atualizarDashboard(){

    const dataHoje =
        hoje();


    const vendasHoje =
        vendas.filter(
            v => v.data === dataHoje
        );


    const normais =
        vendasHoje
            .filter(v => !v.fiado)
            .reduce(
                (s,v) =>
                    s + numero(v.total),
                0
            );


    const quantidade =
        vendasHoje.reduce(
            (s,v) =>
                s + numero(v.quantidade),
            0
        );


    let fiadoAberto = 0;


    vendas
        .filter(v => v.fiado)
        .forEach(v => {

            const pagos =
                pagamentos
                    .filter(
                        p =>
                        p.venda_id === v.id
                    )
                    .reduce(
                        (s,p) =>
                            s + numero(p.valor),
                        0
                    );

            fiadoAberto +=
                Math.max(
                    0,
                    numero(v.total)-pagos
                );

        });


    document.getElementById(
        'hVendas'
    ).textContent =
        dinheiro(normais);


    document.getElementById(
        'hFiado'
    ).textContent =
        dinheiro(fiadoAberto);


    document.getElementById(
        'hQtd'
    ).textContent =
        quantidade;


    document.getElementById(
        'hEstoque'
    ).textContent =
        estoqueTotal();

}


/* =========================================
   MODAL
========================================= */

function abrirModal(tipo){

    const bg =
        document.getElementById('modalBg');

    bg.classList.add('show');


    if(tipo === 'venda')
        telaVenda();

    if(tipo === 'fiado')
        telaFiado();

    if(tipo === 'abastecer')
        telaAbastecer();

    if(tipo === 'estoque')
        telaEstoque();

    if(tipo === 'clientes')
        telaClientes();

    if(tipo === 'relatorio')
        telaRelatorio();

}


function fecharModal(){

    document
        .getElementById('modalBg')
        .classList.remove('show');

}


function fecharFora(e){

    if(
        e.target.id === 'modalBg'
    ){

        fecharModal();

    }

}


function titulo(texto){

    document
        .getElementById('modalTitulo')
        .textContent =
        texto;

}


function conteudo(html){

    document
        .getElementById('modalConteudo')
        .innerHTML =
        html;

}


/* =========================================
   VENDA
========================================= */

function telaVenda(){

    titulo('💰 Registrar venda');


    const options =
        produtos
            .map(
                p =>
                `<option value="${p.id}">
                    ${p.nome}
                </option>`
            )
            .join('');


    conteudo(`

        <label>Produto</label>

        <select id="vProduto"
                onchange="precoVenda()">

            <option value="">
                Selecione o produto
            </option>

            ${options}

        </select>


        <div class="row">

            <div>

                <label>Quantidade</label>

                <input
                    id="vQuantidade"
                    type="number"
                    min="1"
                    step="1"
                    value="1">

            </div>


            <div>

                <label>Preço de venda</label>

                <input
                    id="vPreco"
                    type="number"
                    min="0"
                    step="0.01">

            </div>

        </div>


        <div id="vInfo"
             class="info"
             style="margin-top:15px">

            Selecione um produto.

        </div>


        <button
            class="btn green"
            onclick="registrarVenda()">

            💰 REGISTRAR VENDA

        </button>

    `);

}


function precoVenda(){

    const id =
        document.getElementById(
            'vProduto'
        ).value;


    const p =
        produtoPorId(id);


    if(!p)
        return;


    document.getElementById(
        'vPreco'
    ).value =
        numero(p.preco_repasse);


    document.getElementById(
        'vInfo'
    ).innerHTML =

        `Estoque disponível:
         <strong>
         ${estoqueProduto(p.id)}
         </strong> un.<br>
         Custo:
         ${dinheiro(p.custo)}`;

}


async function registrarVenda(){

    try{

        const produtoId =
            document.getElementById(
                'vProduto'
            ).value;


        const quantidade =
            numero(
                document.getElementById(
                    'vQuantidade'
                ).value
            );


        const preco =
            numero(
                document.getElementById(
                    'vPreco'
                ).value
            );


        const p =
            produtoPorId(produtoId);


        if(!p)
            return alert(
                'Selecione o produto.'
            );


        if(quantidade <= 0)
            return alert(
                'Informe a quantidade.'
            );


        if(preco <= 0)
            return alert(
                'Informe o preço.'
            );


        const estoque =
            estoqueProduto(produtoId);


        if(estoque < quantidade){

            return alert(
                `Estoque insuficiente.
Disponível: ${estoque} unidade(s).`
            );

        }


        const total =
            quantidade * preco;


        const registro = {

            id:idNovo(),

            produto_id:produtoId,

            quantidade:quantidade,

            preco_unitario:preco,

            total:total,

            data:hoje(),

            fiado:false

        };


        const {error} =
            await supabaseClient
                .from('vendas')
                .insert(registro);


        if(error)
            throw error;


        alert(
            '✓ Venda registrada com sucesso!'
        );


        fecharModal();

        await carregar();


    }catch(e){

        console.error(e);

        alert(
            'Erro ao registrar venda:\n\n' +
            e.message
        );

    }

}


/* =========================================
   FIADO
========================================= */

    const produtosOptions =

    conteudo(`

        <label>Cliente</label>

        <select id="fCliente">

            ${clientesOptions}

        </select>


        <button

        <label>Produto</label>

            </option>

        <div class="row">

            </div>

        <div id="fInfo"

            Informe os dados do fiado.

        </div>


        <button

    document.getElementById(

    document.getElementById(
        'fInfo'
    ).innerHTML =

        `Estoque disponível:
        <strong>
        ${estoqueProduto(p.id)}
        </strong> un.`;

}

            ).value;


        const produtoId =
            document.getElementById(
                'fProduto'
            ).value;


        const quantidade =
            numero(
                document.getElementById(

                ).value
            );


        const preco =
            numero(
                document.getElementById(
                    'fPreco'
                ).value
            );


        if(!clienteId)
            return alert(
                'Selecione o cliente.'
            );


        if(!produtoId)
            return alert(
                'Selecione o produto.'
            );


        if(quantidade <= 0)
            return alert(
                'Informe a quantidade.'
            );


        if(preco <= 0)
            return alert(
                'Informe o preço.'
            );


        const estoque =

        if(estoque < quantidade){

            return alert(
                `Estoque insuficiente.
Disponível: ${estoque} unidade(s).`
            );

        }


        const total =
            quantidade * preco;


        const registro = {

            id:idNovo(),

            cliente_id:clienteId

/* =========================================
   CLIENTE RÁPIDO
========================================= */

async function novoClienteRapido(){

    const nome =
        prompt(
            'Nome do cliente:'
        );


    if(!nome)
        return;


    const telefone =
        prompt(
            'Telefone (opcional):'
        ) || '';


    try{

        const registro = {

            id:idNovo(),

            nome:nome.trim(),

            telefone:telefone.trim()

        };


        const {error} =
            await supabaseClient
                .from('clientes')
                .insert(registro);


        if(error)
            throw error;


        await carregar();

        telaFiado();


        setTimeout(()=>{

            const select =
                document.getElementById(
                    'fCliente'
                );

            if(select){

                const novo =
                    clientes.find(
                        c =>
                        c.nome.toLowerCase() ===
                        nome.trim().toLowerCase()
                    );

                if(novo)
                    select.value =
                        novo.id;

            }

        },100);


    }catch(e){

        alert(
            'Erro ao cadastrar cliente:\n\n' +
            e.message
        );

    }

}

   ABASTECER
========================================= */

function telaAbastecer(){

    titulo('📦 Abastecer estoque');


    const options =
        produtos
            .map(
                p =>
                `<option value="${p.id}">
                    ${p.nome}
                </option>`
            )

async function registrarAbastecimento(){

    try{

        const produtoId =
            document.getElementById(
                'aProduto'
            ).value;


        const quantidade =
            numero(
                document.getElementById(
                    'aQuantidade'
                ).value
            );


        const custo =
            numero(
                document.getElementById(
                    'aCusto'
                ).value
            );


        const obs =
            document.getElementById(
                'aObs'
            ).value.trim();


        if(!produtoId)
            return alert(
                'Selecione o produto.'
            );


        if(quantidade <= 0)
            return alert(
                'Informe a quantidade.'
            );


        const registro = {

            id:idNovo(),

            produto_id:produtoId,

            quantidade:quantidade,

            custo_unitario:custo,

            data:hoje()

        };


        const {error} =
            await supabaseClient
                .from('abastecimentos')
                .insert(registro);


        if(error)
            throw error;


        const p =
            produtoPorId(produtoId);


        if(p){

            await supabaseClient
                .from('produtos')
                .update({
                    custo:custo
                })
                .eq('id',produtoId);

        }


        alert(
            '✓ Abastecimento registrado!'
        );


        fecharModal();

        await carregar();


    }catch(e){

        alert(
            'Erro ao abastecer:\n\n' +
            e.message
        );

    }

}

    titulo('⚙️ Ajustar estoque');


    const options =

function mostrarEstoqueAjuste(){

    const id =
        document.getElementById(
            'ajProduto'
        ).value;


    const p =
        produtoPorId(id);


    if(!p)
        return;


    const atual =
        estoqueProduto(id);


    document.getElementById(
        'ajAtual'
    ).innerHTML =

        `Estoque atual:
        <strong>${atual}</strong>
        unidades`;



    document.getElementById(
        'ajQuantidade'
    ).value =
        atual;

}


async function salvarAjuste(){

    try{

        const produtoId =
            document.getElementById(
                'ajProduto'
            ).value;


        const nova =
            numero(
                document.getElementById(
                    'ajQuantidade'
                ).value
            );


        const motivo =
            document.getElementById(
                'ajMotivo'
            ).value.trim();


        if(!produtoId)
            return alert(
                'Selecione o produto.'
            );


        if(nova < 0)
            return alert(
                'Quantidade inválida.'
            );


        const anterior =
            estoqueProduto(produtoId);


        const registro = {

            id:idNovo(),

            produto_id:produtoId,

            quantidade_anterior:anterior,

            quantidade_nova:nova,

            diferenca:nova-anterior,

            motivo:motivo || 'Ajuste manual',

            data:hoje()

        };


        const {error} =
            await supabaseClient
                .from('ajustes_estoque')
                .insert(registro);


        if(error)
            throw error;


        alert(
            '✓ Estoque ajustado com sucesso!'
        );


        await carregar();

        telaEstoque();


    }catch(e){

        alert(
            'Erro ao ajustar estoque:\n\n' +
            e.message
        );

    }

}

/* =========================================
   RECEBER CLIENTE
========================================= */

async function receberCliente(clienteId){

    const devedor =
        vendas.filter(
            v =>
            v.cliente_id === clienteId &&
            v.fiado
        );


    let aberto = 0;


    devedor.forEach(v=>{

        const pago =
            pagamentos
                .filter(
                    p =>
                    p.venda_id === v.id
                )
                .reduce(
                    (s,p) =>
                    s + numero(p.valor),
                    0
                );


        aberto +=
            Math.max(
                0,
                numero(v.total)-pago
            );

    });


    if(aberto <= 0){

        alert(
            'Este cliente não possui débito em aberto.'
        );

        return;

    }


    const valor =
        numero(
            prompt(
                `Valor recebido:\n${dinheiro(aberto)}`,
                aberto.toFixed(2)
            )
        );


    if(valor <= 0)
        return;


    if(valor > aberto){

        alert(
            'O valor recebido não pode ser maior que o débito.'
        );

        return;

    }


    /*
      Distribui o pagamento nas vendas
      mais antigas primeiro.
    */

    let restante =
        valor;


    for(const v of devedor){

        if(restante <= 0)
            break;


        const pago =
            pagamentos
                .filter(
                    p =>
                    p.venda_id === v.id
                )
                .reduce(
                    (s,p) =>
                    s + numero(p.valor),
                    0
                );


        const saldo =
            Math.max(
                0,
                numero(v.total)-pago
            );


        if(saldo <= 0)
            continue;


        const pagamento =
            Math.min(
                saldo,
                restante
            );


        const registro = {

            id:idNovo(),

            cliente_id:clienteId,

            venda_id:v.id,

            valor:pagamento,

            data:hoje()

        };


        const {error} =
            await supabaseClient
                .from('pagamentos')
                .insert(registro);


        if(error)
            throw error;


        restante -=
            pagamento;

    }


    alert(
        '✓ Pagamento registrado!'
    );


    await carregar();

    telaClientes();

}
